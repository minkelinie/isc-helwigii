site_name: I.S.C. Helwigii
site_description: Evidence-first cuneiform research workbench
site_author: Mink Helwig
repo_url: https://github.com/minkelinie/isc-helwigii
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - scheme: slate
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Local research guide: local-research-guide.md
  - Local product plan: superpowers/plans/2026-09-05-local-research-product.md
  - Verification record: verification-2026-09-05.md
  - Foundation design: plans/2026-09-04-evidence-first-foundation-design.md
  - Implementation plan: superpowers/plans/2026-09-04-repository-test-foundation.md
  - Repository policy: repository-policy.md

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            docstring_style: google
            members_order: source

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/minkelinie/isc-helwigii

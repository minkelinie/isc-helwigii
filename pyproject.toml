[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isc-helwigii"
version = "2.0.0"
description = "Interpres scripturae cuneiformis Helwigii — Multimodal Cuneiform Analysis Platform"
readme = "README.md"
license = {text = "CC-BY-4.0"}
requires-python = ">=3.11"
authors = [
    {name = "Mink Helwig", email = "mink@helwig.nl"}
]
maintainers = [
    {name = "SignumCore", email = "infra@signumcore.nl"}
]
keywords = [
    "cuneiform", "assyriology", "digital-humanities", "spijkerschrift",
    "fragment-reconstruction", "sign-detection", "phylogenetics",
    "polyphony", "mythology", "active-learning", "fair-data"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: CC-BY-4.0",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/minkelinie/isc-helwigii"
Repository = "https://github.com/minkelinie/isc-helwigii"
Documentation = "https://github.com/minkelinie/isc-helwigii/tree/main/docs"
Issues = "https://github.com/minkelinie/isc-helwigii/issues"
Changelog = "https://github.com/minkelinie/isc-helwigii/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ui = ["streamlit>=1.35,<2"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "pre-commit>=3.7",
    "types-requests",
    "types-PyYAML",
    "pyyaml>=6.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=1.14",
]

[project.scripts]
isc-helwigii = "isc_helwigii.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["isc_helwigii*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "T20"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["polyphony_engine", "corpus_registry", "sign_detection_engine", "phylomythology_engine"]
combine-as-imports = true

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
  | \.eggs
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", ".git", "__pycache__", "build", "dist"]
skips = ["B101", "B601"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=isc_helwigii --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.coverage.run]
source = ["src/isc_helwigii"]
omit = ["tests/*", "*/__pycache__/*", "*/.venv/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]

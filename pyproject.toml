[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ox-stealth-myth-hunter"
version = "1.0.0"
description = "Multi-lingual Cuneiform Corpus Pipeline: Ingestion → Normalization → Motif/Entity Extraction → Clustering → Knowledge Graph → Dashboard"
readme = "README.md"
license = {text = "CC-BY-4.0"}
authors = [{name = "Mink Helwig", email = "mink@signumcore.nl"}]
keywords = ["cuneiform", "digital-humanities", "nlp", "knowledge-graph", "sumerian", "akkadian", "hittite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: CC-BY-4.0",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "torch>=2.1",
    "transformers>=4.35",
    "scikit-learn>=1.3",
    "seaborn>=0.13",
    "sentence-transformers>=2.2",
    "plotly>=5.17",
    "streamlit>=1.28",
    "numpy>=1.24",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.1.6",
    "black>=23.10",
    "mypy>=1.7",
    "bandit>=1.7",
    "pre-commit>=3.5",
    "mkdocs-material>=9.4",
    "mkdocstrings[python]>=0.24",
    "mkdocs-autorefs>=1.0",
]
publish = [
    "zenodo-client>=0.8",
    "twine>=4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20", "ARG", "PTH", "ERA", "PL", "TRY"]
ignore = ["S101", "TRY003"]
fixable = ["ALL"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict_equality = true
no_implicit_optional = true
check_untyped_defs = true

[tool.bandit]
exclude_dirs = ["tests", "export", "__pycache__"]
skips = ["B101", "B601"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short --cov=ox_stealth --cov-report=term-missing"

[tool.setuptools.packages.find]
where = ["."]
include = ["ox_stealth*"]

[tool.mkdocs]
site_name = "OX-Stealth Myth Hunter"
site_url = "https://signumcore.github.io/ox-stealth-myth-hunter/"
repo_url = "https://github.com/SignumCore/ox-stealth-myth-hunter"
theme = {name = "material", palette = [{scheme = "default", primary = "indigo", accent = "amber"}, {scheme = "slate", primary = "indigo", accent = "amber"}], features = ["navigation.tabs", "navigation.sections", "navigation.top", "search.suggest", "search.highlight", "content.code.copy", "content.tabs.link"]}
markdown_extensions = ["pymdownx.highlight", "pymdownx.superfences", "pymdownx.tabbed", "admonition", "attr_list", "md_in_html", "toc"]
plugins = ["search", "autorefs", "mkdocstrings"]
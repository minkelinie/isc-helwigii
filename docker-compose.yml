services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - research_projects:/data
    environment:
      ISC_HELWIGII_PROJECT: /data/research.db
      ISC_HELWIGII_DB_PATH: /data/research.db
    restart: unless-stopped
volumes:
  research_projects:

name: CI/CD — Ox-Stealth Myth Hunter

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.10"
  DB_PATH: "/data/cuneiform_master.db"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: ${{env.PYTHON_VERSION}}, cache: "pip"}
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Black check
        run: black --check .
      - name: MyPy type check
        run: mypy ox_stealth

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: ${{env.PYTHON_VERSION}}, cache: "pip"}
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest with coverage
        run: pytest --cov=ox_stealth --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with: {files: ./coverage.xml, fail_ci_if_error: false}

  security:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: ${{env.PYTHON_VERSION}}, cache: "pip"}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Bandit scan
        run: bandit -r ox_stealth -f json -o bandit-report.json || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: {sarif_file: bandit-report.json, category: bandit}

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, security]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ox-stealth-myth-hunter:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image health check
        run: |
          docker run --rm ox-stealth-myth-hunter:${{ github.sha }} \
            python -c "from ox_stealth.pipeline import OxStealthPipeline; print(OxStealthPipeline().health_check())"

  publish-zenodo:
    name: Publish to Zenodo
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: ${{env.PYTHON_VERSION}}, cache: "pip"}
      - name: Install publish deps
        run: pip install -e ".[publish]"
      - name: Configure Zenodo
        run: |
          echo "ZENODO_TOKEN=${{ secrets.ZENODO_TOKEN }}" >> $GITHUB_ENV
      - name: Upload to Zenodo
        run: |
          python - <<'PY'
          import os, json, requests
          from pathlib import Path

          token = os.environ["ZENODO_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          r = requests.post("https://zenodo.org/api/deposit/depositions", headers=headers, json={})
          r.raise_for_status()
          dep = r.json()
          dep_id = dep["id"]
          bucket = dep["links"]["bucket"]

          export_dir = Path("/data/export")
          files = [
              "cuneiform_master.db",
              "myth_hunter.graphml",
              "myth_hunter.cypher",
              "datacite.json",
              "dashboard/index.html",
          ]
          for fname in files:
              fpath = export_dir / fname
              if fpath.exists():
                  with fpath.open("rb") as f:
                      requests.put(f"{bucket}/{fname}", headers={"Authorization": f"Bearer {token}"}, data=f)
                      print(f"Uploaded {fname}")

          with (export_dir / "datacite.json").open() as f:
              meta = json.load(f)
          requests.put(f"https://zenodo.org/api/deposit/depositions/{dep_id}", headers=headers, json={"metadata": meta})

          requests.post(f"https://zenodo.org/api/deposit/depositions/{dep_id}/actions/publish", headers=headers)
          print(f"Published deposition {dep_id}")
          PY
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}

  deploy-docs:
    name: Deploy Documentation (GitHub Pages)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: ${{env.PYTHON_VERSION}}, cache: "pip"}
      - name: Install docs deps
        run: pip install -e ".[dev]"
      - name: Build MkDocs site
        run: mkdocs build --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with: {path: ./site}
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source without LFS artifacts
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,ui]"

      - name: Lint foundation code
        run: ruff check src tests scripts

      - name: Run tests
        run: python -m pytest
      - name: Check documentation navigation
        run: python scripts/check_docs.py

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without LFS artifacts
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .

      - name: Verify installed wheel contract
        run: python scripts/check_wheel.py dist/isc_helwigii-*.whl
